<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifa en el liceo - Contacto</title>
    <meta name="author" content="Kevin Trujillo">
    <meta name="keywords" content="rifa, contacto, liceo, dudas">
    <meta name="description" content="Contáctanos y resuelve tus dudas sobre la rifa del liceo.">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1><a href="index.html">Rifa en el liceo</a></h1>
        <button id="boton_menu">Menu</button>
        <nav class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="servicios.html">Servicios</a>
            <a href="contacto.html">Contacto</a>
            <a href="finanzas.html">Finanzas</a>
        </nav>
    </header>
    <main>
        <section id="contacto">
            <div class="contacto-grid">

                <div class="columna-info">
                    <div class="info-contacto">
                        <h3>Encuéntranos</h3>
                        <iframe 
                            src="https://www.google.com/maps?q=Liceo%20B-72%20Santiago&output=embed"
                            width="100%" 
                            height="200" 
                            style="border:0; border-radius: 8px;" 
                            allowfullscreen="" 
                            loading="lazy">
                        </iframe>
                        <p>📍 Dirección: Liceo B-72, Santiago</p>
                        <p>📞 Teléfono: +56 9 1234 5678</p>
                        <p>✉️ Correo: contacto@rifaliceo.cl</p>
                    </div>

                    <form id="contacto-form">
                        <h3>Envíanos un mensaje</h3>
                        <div>
                            <label for="nombre">Nombre:</label>
                            <input type="text" id="nombre" name="nombre">
                        </div>
                        <div>
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email">
                        </div>
                        <div>
                            <label for="mensaje">Mensaje:</label>
                            <textarea id="mensaje" name="mensaje"></textarea>
                        </div>
                        <div id="errores-contacto"></div>
                        <button type="submit">Enviar</button>
                    </form>
                </div>

                <div class="columna-login">
                    <form id="login-form">
                        <h3>Acceso Administrador</h3>
                        <div>
                            <label for="usuario-login">Usuario:</label>
                            <input type="text" id="usuario-login">
                        </div>
                        <div>
                            <label for="clave-login">Contraseña:</label>
                            <input type="password" id="clave-login">
                        </div>
                        <div id="error-login"></div>
                        <button type="submit">Ingresar</button>
                    </form>

                    <div id="panel-admin" style="display: none;"></div>
                </div>

            </div>
        </section>
    </main>
    <footer>
        <p class="parrafo">&copy; 2026 Rifa en el liceo.</p>
    </footer>
    <script src="js/app.js"></script>
</body>
</html>
